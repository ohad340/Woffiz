<!doctype html>
<!--
  Woffiz offline fallback. Served by public/sw.js ONLY when a page navigation fails because the network is unavailable.
  Public and static: no user data, no external files. Token values in :root are copied from src/styles/tokens.css;
  src/lib/offline-page.test.ts keeps them in sync. Wi-Fi-off icon: Lucide (ISC license).
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5BB8F5" />
    <title>אין חיבור · Woffiz</title>
    <style>
      :root {
        --color-cta: #ffc22e;
        --color-cta-hover: #ffb703;
        --color-cta-edge: #e08a00;
        --color-on-cta: #3d2600;
        --color-bg: #e4f4fe;
        --color-surface: #ffffff;
        --color-text: #1d2b3a;
        --color-text-muted: #4e5d6c;
        --color-warning: #8a5300;
        --color-focus: #1f5fae;
        --scene-sky-bottom: #c4e9fd;
        --font-family: 'Heebo', Arial, sans-serif;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --gutter: 20px;
        --width-form: 560px;
        --radius-lg: 28px;
        --shadow-card: 0 6px 18px rgba(29, 43, 58, 0.1);
        --shadow-pop: 0 4px 0 rgba(29, 43, 58, 0.15);
        --cta-height: 60px;
        --duration-button: 150ms;
      }
      @media (max-width: 360px) {
        :root {
          --gutter: 16px;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-block-size: 100dvh;
        display: grid;
        place-items: center;
        padding-block: max(var(--space-8), env(safe-area-inset-top)) max(var(--space-8), env(safe-area-inset-bottom));
        padding-inline: max(var(--gutter), env(safe-area-inset-right)) max(var(--gutter), env(safe-area-inset-left));
        background: linear-gradient(180deg, var(--scene-sky-bottom) 0, var(--color-bg) 360px) no-repeat, var(--color-bg);
        color: var(--color-text);
        font: 400 1rem/1.6 var(--font-family);
        text-align: start;
        overflow-wrap: anywhere;
      }
      main {
        inline-size: 100%;
        max-inline-size: var(--width-form);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-8) var(--space-6);
        border-radius: var(--radius-lg);
        background: var(--color-surface);
        box-shadow: var(--shadow-pop), var(--shadow-card);
        text-align: center;
      }
      main:focus {
        outline: none;
      }
      svg {
        display: block;
        color: var(--color-warning);
      }
      h1 {
        margin: 0;
        font: 800 1.75rem/1.3 var(--font-family);
      }
      p {
        margin: 0;
        max-inline-size: 60ch;
        color: var(--color-text-muted);
      }
      button {
        --lip: 4px;
        margin-block-start: var(--space-2);
        inline-size: 100%;
        min-block-size: var(--cta-height);
        padding-block: var(--space-2);
        padding-inline: var(--space-6);
        border: 2px solid var(--color-cta-edge);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, #ffd65c 0%, var(--color-cta) 55%);
        box-shadow: 0 var(--lip) 0 var(--color-cta-edge), 0 8px 16px rgba(224, 138, 0, 0.3);
        color: var(--color-on-cta);
        font: 800 1.25rem/1.4 var(--font-family);
        cursor: pointer;
      }
      button:hover {
        background: linear-gradient(180deg, #ffcf3f 0%, var(--color-cta-hover) 55%);
      }
      button:active {
        transform: translateY(var(--lip));
        box-shadow: none;
      }
      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition:
            background-color var(--duration-button) ease,
            box-shadow var(--duration-button) ease,
            transform var(--duration-button) ease;
        }
      }
    </style>
  </head>
  <body>
    <main id="main" tabindex="-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
        <path d="m2 2 20 20" />
      </svg>
      <h1>אין חיבור לאינטרנט</h1>
      <p>לא הצלחנו לפתוח את הדף כי אין כרגע חיבור. ההתקדמות שלך שמורה, ושום דיווח לא יישמר עד שהחיבור יחזור.</p>
      <p>כשהחיבור יחזור, לחצו על „ניסיון חוזר”.</p>
      <button type="button" id="retry">ניסיון חוזר</button>
    </main>
    <script>
      // Always reload the current URL: online it returns the original page, offline the service worker serves this page again.
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload()
      })
    </script>
  </body>
</html>

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # `prisma generate` reads the config; no database is contacted in this job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-ci-build
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  postgres:
    name: Integration and e2e on standard PostgreSQL
    # Pinned: on ubuntu-latest (Ubuntu 26.04) apt DNS resolution failed during the Playwright dependency install; revisit when ubuntu-latest is stable.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woffiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A separate database that the suites are allowed to wipe.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woffiz_test
      # Real PostgreSQL with independent connections: row-locking tests run here and nowhere else.
      TEST_DB_KIND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integration tests (includes concurrency / row locking)
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=test-results/integration.json
      # TEST_DB_KIND alone cannot show that the PostgreSQL-only tests really ran: a skipped test is not a pass.
      - name: Require the PostgreSQL-only tests to have executed and passed
        run: node scripts/assert-required-tests.mjs test-results/integration.json
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
